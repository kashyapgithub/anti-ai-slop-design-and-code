<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Detail Registry</title>
<style>
  :root {
    --ink: #1a1d23;
    --ink-muted: #5a6270;
    --border: #e2e5eb;
    --surface: #ffffff;
    --surface-alt: #f6f7f9;
    --accent: #3454d1;
    --accent-soft: #edf0fc;
    --deprecated: #b3541e;
    --deprecated-soft: #fdf1e9;
    --radius: 6px;
    /* Semantic, deliberate per-type colors — not decorative rainbow.
       button = primary action (matches --accent); input = form data
       (violet); link = navigation (teal); toggle = a switched state
       (amber); banner = something conditional worth noticing (rose).
       Unrecognized types fall back to a neutral gray, not a random hue. */
    --type-button: #3454d1;    --type-button-bg: #edf0fc;
    --type-input:  #7c3aed;    --type-input-bg:  #f3ecfd;
    --type-link:   #0d9488;    --type-link-bg:   #e6f6f4;
    --type-toggle: #b45309;    --type-toggle-bg: #fdf1e0;
    --type-banner: #be123c;    --type-banner-bg: #fde8ec;
    --type-default:#5a6270;    --type-default-bg:#eef0f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--surface-alt);
    line-height: 1.5;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sync-note {
    font-size: 0.8rem;
    color: var(--ink-muted);
    margin: 0 0 14px;
  }
  .sync-note code { background: var(--surface-alt); padding: 1px 5px; border-radius: 4px; }
  #search {
    width: 100%;
    max-width: 420px;
    padding: 9px 34px 9px 12px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-wrap { position: relative; max-width: 420px; }
  .search-shortcut-hint {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem;
    color: var(--ink-muted);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    pointer-events: none;
  }
  #search:focus ~ .search-shortcut-hint { display: none; }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 28px 60px;
  }
  .feature-group {
    margin-bottom: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .feature-group h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .feature-group h2 .letter {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.85rem;
  }
  .feature-group h2 .folder {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
    font-weight: 400;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  td {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 0.86rem;
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr.ui-row { transition: background-color 0.12s ease; }
  tr.ui-row:hover td { background: var(--surface-alt); }
  tr.sub-row:hover td { background: #eef0f4; }
  tr.is-hidden { display: none; }
  tr.is-deprecated { opacity: 0.55; }
  tr.is-deprecated td.id-cell::after {
    content: "deprecated";
    display: inline-block;
    margin-left: 6px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--deprecated);
    background: var(--deprecated-soft);
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .id-cell {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    scroll-margin-top: 90px;
  }
  .id-cell:target, tr.is-target td { background: var(--accent-soft); }
  tr.sub-row { background: var(--surface-alt); }
  tr.sub-row td { font-size: 0.82rem; }
  .sub-id-cell {
    padding-left: 32px;
    position: relative;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .sub-id-cell::before {
    content: "\21B3";
    position: absolute;
    left: 16px;
    color: var(--border);
  }
  .id-wrap { display: inline-flex; align-items: center; gap: 6px; }
  .copy-btn {
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 0.8rem;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.1s ease, background-color 0.1s ease, color 0.1s ease;
  }
  tr.ui-row:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
  .copy-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .copy-btn.is-copied { opacity: 1; color: #0a7d3d; }
  .type-badge {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .props-cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .prop-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.74rem;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .component-cell code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.82rem;
    background: var(--surface-alt);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .appears-cell { color: var(--ink); }
  .notes-cell { color: var(--ink-muted); }
  .notes-cell a, .appears-cell a {
    color: var(--accent);
    text-decoration: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600;
  }
  .notes-cell a:hover, .appears-cell a:hover { text-decoration: underline; }
  .empty-state, .no-results {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-size: 0.9rem;
  }
  .count-badge {
    font-size: 0.78rem;
    color: var(--ink-muted);
    font-weight: 400;
  }
</style>
</head>
<body>

<header>
  <h1>UI Detail Registry</h1>
  <p class="sync-note">
    Mirrors <code>UI-DETAIL.md</code> — same facts, two views. Update both files in the same commit.
    Last synced: <code id="synced-at">(set this when you sync)</code>.
    See <code>anti-ai-slop-design.md</code> §12.3.
  </p>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search by ID, name, component, or condition&hellip;" aria-label="Search UI registry">
    <span class="search-shortcut-hint">/</span>
  </div>
</header>

<main id="app"></main>

<script>
  // ---------------------------------------------------------------------
  // SINGLE SOURCE OF DATA FOR THIS FILE. Mirror UI-DETAIL.md's tables
  // exactly — same letters, same IDs, same "appears when" text. Update
  // this array in the same commit as any change to UI-DETAIL.md; treat
  // the two files as one fact set with two views, never one derived
  // from the other by a build step.
  //
  // Fields:
  //   letter, folder   — matches the "Letter map" table in the .md
  //   id, name, component, appearsWhen, notes — matches a row in the
  //     .md's per-feature table, in the same order
  //   deprecated: true — for a row marked [deprecated] in the .md
  //   relatedIds: ["a1"] — other IDs mentioned in notes/appearsWhen,
  //     so they render as clickable jump links instead of plain text
  // ---------------------------------------------------------------------
  const DATA = {
    syncedAt: "YYYY-MM-DD — set this whenever the arrays below change",
    groups: [
      // Example — replace with your project's real entries, or delete
      // this group entirely once real ones exist.
      {
        letter: "a",
        folder: "features/auth/",
        rows: [
          {
            id: "a1",
            name: "Login form",
            component: "LoginForm.tsx",
            appearsWhen: "Default view at /login for any unauthenticated visitor.",
            notes: "",
            relatedIds: [],
            children: [
              {
                id: "a1.a",
                element: "\"Sign in\" button",
                type: "button",
                action: "Submits the form; on success redirects to dashboard.",
                props: ["isSubmitting", ".btn-primary"],
                notes: "Disabled while submitting.",
                relatedIds: []
              },
              {
                id: "a1.b",
                element: "\"Forgot password?\" link",
                type: "link",
                action: "Opens a2.",
                props: ["--color-link"],
                notes: "",
                relatedIds: ["a2"]
              }
            ]
          },
          {
            id: "a2",
            name: "Password reset modal",
            component: "ResetModal.tsx",
            appearsWhen: "User clicks \"Forgot password?\" on a1.",
            notes: "Child of a1; cancel returns to a1.",
            relatedIds: ["a1"]
          }
        ]
      },
      {
        letter: "b",
        folder: "features/billing/",
        rows: [
          {
            id: "b5",
            name: "Downgrade confirmation",
            component: "DowngradeConfirm.tsx",
            appearsWhen: "User selects a lower plan on the billing page AND subscription.status === 'active'.",
            notes: "Blocks downgrade if usage.seats > newPlan.seatLimit; shows b6 instead in that case.",
            relatedIds: [],
            children: [
              {
                id: "b5.a",
                element: "\"Cancel\" button",
                type: "button",
                action: "Closes the modal, returns to the billing page. No request sent.",
                props: ["variant=\"secondary\"", ".btn-secondary"],
                notes: "",
                relatedIds: []
              },
              {
                id: "b5.b",
                element: "\"Confirm downgrade\" button",
                type: "button",
                action: "Calls PATCH /subscription with the new plan. On success, closes and refreshes the billing page.",
                props: ["isSubmitting", "variant=\"danger\"", "--color-danger"],
                notes: "Disabled while isSubmitting; see b5.c for the state that gates it.",
                relatedIds: ["b5.c"]
              },
              {
                id: "b5.c",
                element: "Seat-count warning banner",
                type: "banner",
                action: "\u2014",
                props: ["--color-warning-bg", "--color-warning-text"],
                notes: "Only rendered when usage.seats > newPlan.seatLimit; its presence is what disables b5.b.",
                relatedIds: ["b5.b"]
              }
            ]
          }
        ]
      }
    ]
  };

  // Deliberate, semantic per-type colors — see the CSS custom properties
  // above for the reasoning. Add an entry here if you introduce a new
  // element type; anything not listed falls back to a neutral gray
  // rather than picking a random hue.
  const TYPE_COLORS = {
    button: "button",
    input: "input",
    toggle: "toggle",
    link: "link",
    banner: "banner"
  };

  function typeBadgeHtml(type) {
    const key = TYPE_COLORS[type] || "default";
    return (
      '<span class="type-badge" style="color: var(--type-' + key +
      '); background: var(--type-' + key + '-bg);">' + escapeHtml(type) + "</span>"
    );
  }

  function propsHtml(props) {
    if (!props || props.length === 0) return "";
    return (
      '<div class="props-cell">' +
      props.map(function (p) { return '<span class="prop-chip">' + escapeHtml(p) + "</span>"; }).join("") +
      "</div>"
    );
  }

  const COPY_ICON_SVG =
    '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/>' +
    '<path d="M3.5 10.5H2.75A1.25 1.25 0 0 1 1.5 9.25v-6.5A1.25 1.25 0 0 1 2.75 1.5h6.5A1.25 1.25 0 0 1 10.5 2.75V3.5" stroke="currentColor" stroke-width="1.3"/>' +
    "</svg>";
  const CHECK_ICON_SVG =
    '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    "</svg>";

  function idWithCopyHtml(id) {
    return (
      '<span class="id-wrap">' +
      '<span id="' + escapeHtml(id) + '">' + escapeHtml(id) + "</span>" +
      '<button type="button" class="copy-btn" data-copy-id="' + escapeHtml(id) +
      '" title="Copy ID" aria-label="Copy ID ' + escapeHtml(id) + '">' + COPY_ICON_SVG + "</button>" +
      "</span>"
    );
  }

  function escapeRegex(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function linkify(text, relatedIds) {
    if (!relatedIds || relatedIds.length === 0) return escapeHtml(text);
    let out = escapeHtml(text);
    relatedIds.forEach(function (rid) {
      const re = new RegExp("\\b" + escapeRegex(rid) + "\\b", "g");
      out = out.replace(re, '<a href="#' + rid + '">' + rid + "</a>");
    });
    return out;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function childRowHtml(child, parentId) {
    return (
      '<tr class="ui-row sub-row" data-parent="' + escapeHtml(parentId) + '" data-search="' +
      escapeHtml((child.id + " " + child.element + " " + child.type + " " + child.action + " " + (child.notes || "") + " " + (child.props || []).join(" ")).toLowerCase()) +
      '">' +
      '<td class="id-cell">' + idWithCopyHtml(child.id, "sub-id-cell") + "</td>" +
      "<td>" + escapeHtml(child.element) + "</td>" +
      "<td>" + typeBadgeHtml(child.type) + "</td>" +
      '<td class="appears-cell">' + linkify(child.action, child.relatedIds) + "</td>" +
      "<td>" + propsHtml(child.props) + "</td>" +
      '<td class="notes-cell">' + linkify(child.notes || "", child.relatedIds) + "</td>" +
      "</tr>"
    );
  }

  function render() {
    const app = document.getElementById("app");
    document.getElementById("synced-at").textContent = DATA.syncedAt;

    if (!DATA.groups.length) {
      app.innerHTML = '<p class="empty-state">No entries yet. Add rows to the DATA object in this file (and to UI-DETAIL.md) as panels are built.</p>';
      return;
    }

    app.innerHTML = DATA.groups.map(function (group) {
      const rows = group.rows.map(function (row) {
        const cls = ["ui-row"];
        if (row.deprecated) cls.push("is-deprecated");
        const parentRow = (
          '<tr class="' + cls.join(" ") + '" data-search="' +
          escapeHtml((row.id + " " + row.name + " " + row.component + " " + row.appearsWhen + " " + row.notes).toLowerCase()) +
          '">' +
          '<td class="id-cell">' + idWithCopyHtml(row.id) + "</td>" +
          "<td>" + escapeHtml(row.name) + "</td>" +
          '<td class="component-cell"><code>' + escapeHtml(row.component) + "</code></td>" +
          '<td class="appears-cell">' + linkify(row.appearsWhen, row.relatedIds) + "</td>" +
          "<td></td>" +
          '<td class="notes-cell">' + linkify(row.notes, row.relatedIds) + "</td>" +
          "</tr>"
        );
        const childRows = (row.children || []).map(function (child) {
          return childRowHtml(child, row.id);
        }).join("");
        return parentRow + childRows;
      }).join("");

      return (
        '<section class="feature-group">' +
        "<h2><span class=\"letter\">" + escapeHtml(group.letter) + '</span> ' + escapeHtml(group.folder) +
        ' <span class="count-badge">(' + group.rows.length + ")</span></h2>" +
        "<table>" +
        "<thead><tr><th>ID</th><th>Name / Element</th><th>Component / Type</th><th>Appears when / Action</th><th>Key props / style</th><th>Notes</th></tr></thead>" +
        "<tbody>" + rows + '<tr class="no-results-row is-hidden"><td colspan="6" class="no-results">No matches for this search.</td></tr>' +
        "</tbody>" +
        "</table>" +
        "</section>"
      );
    }).join("");

    // Jump to a specific ID via ?id=b5 or a #b5 hash, and highlight it.
    const hash = window.location.hash.replace("#", "");
    if (hash) {
      const target = document.getElementById(hash);
      if (target) {
        const row = target.closest("tr");
        if (row) row.classList.add("is-target");
        if (typeof target.scrollIntoView === "function") {
          try {
            target.scrollIntoView({ block: "center" });
          } catch (e) {
            /* scrollIntoView is best-effort — the highlight above is what actually matters */
          }
        }
      }
    }
  }

  document.getElementById("search").addEventListener("input", function (e) {
    const q = e.target.value.trim().toLowerCase();
    const allRows = document.querySelectorAll("tr.ui-row");

    if (q.length === 0) {
      allRows.forEach(function (row) { row.classList.remove("is-hidden"); });
      document.querySelectorAll(".no-results-row").forEach(function (r) { r.classList.add("is-hidden"); });
      return;
    }

    const ownMatch = new Map();
    allRows.forEach(function (row) {
      const hay = row.getAttribute("data-search") || "";
      ownMatch.set(row, hay.includes(q));
    });

    allRows.forEach(function (row) {
      if (row.classList.contains("sub-row")) return; // parents handled below
      const parentMatches = ownMatch.get(row);
      const rowId = row.querySelector(".id-cell [id]").id;
      const children = document.querySelectorAll('tr.sub-row[data-parent="' + rowId + '"]');
      let anyChildMatches = false;
      children.forEach(function (c) { if (ownMatch.get(c)) anyChildMatches = true; });

      const parentVisible = parentMatches || anyChildMatches;
      row.classList.toggle("is-hidden", !parentVisible);

      children.forEach(function (c) {
        // If the parent text itself matched, show all its children for
        // context. Otherwise show only the children that individually
        // matched the query.
        const childVisible = parentMatches || ownMatch.get(c);
        c.classList.toggle("is-hidden", !childVisible);
      });
    });

    // Show a "no matches" row per table whose every real row is hidden.
    document.querySelectorAll(".feature-group table").forEach(function (table) {
      const noResultsRow = table.querySelector(".no-results-row");
      if (!noResultsRow) return;
      const anyVisible = Array.from(table.querySelectorAll("tr.ui-row"))
        .some(function (r) { return !r.classList.contains("is-hidden"); });
      noResultsRow.classList.toggle("is-hidden", anyVisible);
    });
  });

  // Copy an ID to the clipboard on click, with a fallback for contexts
  // (like a plain file:// page in some browsers) where the modern
  // Clipboard API isn't available. Success is shown by briefly swapping
  // the icon, not an alert — the point is speed, not interruption.
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy") ? resolve() : reject(new Error("execCommand copy failed"));
      } catch (err) {
        reject(err);
      } finally {
        document.body.removeChild(ta);
      }
    });
  }

  document.getElementById("app").addEventListener("click", function (e) {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;
    const id = btn.getAttribute("data-copy-id");
    copyText(id).then(function () {
      const original = btn.innerHTML;
      btn.innerHTML = CHECK_ICON_SVG;
      btn.classList.add("is-copied");
      setTimeout(function () {
        btn.innerHTML = original;
        btn.classList.remove("is-copied");
      }, 1200);
    }).catch(function () {
      /* Clipboard access denied or unavailable — the ID is still
         visible and selectable by hand, so this fails quietly rather
         than interrupting with an error dialog. */
    });
  });

  // Press "/" anywhere outside a text field to jump straight to search —
  // matches the convention from GitHub and similar tools.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/") return;
    const active = document.activeElement;
    const isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable);
    if (isTyping) return;
    e.preventDefault();
    document.getElementById("search").focus();
  });

  render();
</script>

</body>
</html>
