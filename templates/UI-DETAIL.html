<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Detail Registry</title>
<style>
  :root {
    --ink: #1a1d23;
    --ink-muted: #5a6270;
    --border: #e2e5eb;
    --surface: #ffffff;
    --surface-alt: #f6f7f9;
    --accent: #3454d1;
    --accent-soft: #edf0fc;
    --deprecated: #b3541e;
    --deprecated-soft: #fdf1e9;
    --radius: 6px;
    /* Semantic, deliberate per-type colors — not decorative rainbow.
       button = primary action (matches --accent); input = form data
       (violet); link = navigation (teal); toggle = a switched state
       (amber); banner = something conditional worth noticing (rose).
       Unrecognized types fall back to a neutral gray, not a random hue. */
    --type-button: #3454d1;    --type-button-bg: #edf0fc;
    --type-input:  #7c3aed;    --type-input-bg:  #f3ecfd;
    --type-link:   #0f766e;    --type-link-bg:   #e6f6f4;
    --type-toggle: #b45309;    --type-toggle-bg: #fdf1e0;
    --type-banner: #be123c;    --type-banner-bg: #fde8ec;
    --type-default:#5a6270;    --type-default-bg:#eef0f3;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
  .skip-link {
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    z-index: 100;
    border-radius: 0 0 6px 0;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .skip-link:focus { left: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--surface-alt);
    line-height: 1.5;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sync-note {
    font-size: 0.8rem;
    color: var(--ink-muted);
    margin: 0 0 14px;
  }
  .sync-note code { background: var(--surface-alt); padding: 1px 5px; border-radius: 4px; }
  .view-toggle {
    display: inline-flex;
    gap: 2px;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 14px;
  }
  .view-btn {
    border: none;
    background: transparent;
    color: var(--ink-muted);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.12s ease, color 0.12s ease;
  }
  .view-btn:hover { color: var(--ink); }
  .view-btn.is-active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .view-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .quick-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 14px;
  }
  .quick-nav a {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid transparent;
    padding: 3px 10px;
    border-radius: 999px;
    text-decoration: none;
    transition: background-color 0.12s ease, border-color 0.12s ease;
  }
  .quick-nav a:hover { border-color: var(--accent); }
  .quick-nav a:focus-visible, .copy-btn:focus-visible, #search:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .results-status {
    font-size: 0.78rem;
    color: var(--ink-muted);
    margin-top: 6px;
    min-height: 1.1em;
  }
  .panel-description {
    display: block;
    color: var(--ink-muted);
    font-size: 0.8rem;
    font-weight: 400;
    margin-top: 2px;
  }

  /* ---- Map view ---- */
  #map { position: relative; }
  .map-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    font-size: 0.76rem;
    color: var(--ink-muted);
    margin-bottom: 16px;
    align-items: center;
  }
  .map-legend .swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 5px;
    vertical-align: -1px;
  }
  .map-group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px 22px;
    margin-bottom: 24px;
  }
  .map-group-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 14px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .map-lane {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .map-node {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    min-width: 180px;
    max-width: 260px;
    transition: box-shadow 0.15s ease, border-color 0.15s ease;
    scroll-margin-top: 90px;
  }
  .map-node:hover, .map-node.is-connected {
    box-shadow: 0 2px 10px rgba(52, 84, 209, 0.14);
    border-left-color: var(--accent);
  }
  .map-node.is-deprecated { opacity: 0.5; }
  .map-node-id {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
    font-size: 0.82rem;
  }
  .map-node-name {
    font-size: 0.82rem;
    color: var(--ink);
    margin-top: 2px;
  }
  .map-node-condition {
    font-size: 0.72rem;
    color: var(--ink-muted);
    margin-top: 6px;
    line-height: 1.4;
    border-top: 1px dashed var(--border);
    padding-top: 6px;
  }
  .map-subnodes {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .map-subnode {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    scroll-margin-top: 90px;
  }
  #map-connectors {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  #map-connectors path {
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.5;
    opacity: 0.45;
    transition: opacity 0.15s ease, stroke-width 0.15s ease;
  }
  #map-connectors path.is-highlighted { opacity: 0.95; stroke-width: 2.25; }
  .map-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-size: 0.9rem;
  }

  #search {
    width: 100%;
    max-width: 420px;
    padding: 9px 34px 9px 12px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-wrap { position: relative; max-width: 420px; }
  .search-shortcut-hint {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem;
    color: var(--ink-muted);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    pointer-events: none;
  }
  #search:focus ~ .search-shortcut-hint { display: none; }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 28px 60px;
  }
  .feature-group {
    margin-bottom: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .feature-group h2 {
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .feature-group h2 .letter {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.85rem;
  }
  .feature-group h2 .folder {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
    font-weight: 400;
  }
  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  td {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 0.86rem;
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr.ui-row { transition: background-color 0.12s ease; }
  tr.ui-row:hover td { background: var(--surface-alt); }
  tr.sub-row:hover td { background: #eef0f4; }
  tr.is-hidden { display: none; }
  tr.is-deprecated { opacity: 0.55; }
  tr.is-deprecated td.id-cell::after {
    content: "deprecated";
    display: inline-block;
    margin-left: 6px;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--deprecated);
    background: var(--deprecated-soft);
    padding: 1px 6px;
    border-radius: 4px;
    vertical-align: middle;
  }
  .id-cell {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    scroll-margin-top: 90px;
  }
  .id-cell:target, tr.is-target td { background: var(--accent-soft); }
  tr.sub-row { background: var(--surface-alt); }
  tr.sub-row td { font-size: 0.82rem; }
  .sub-id-cell {
    padding-left: 32px;
    position: relative;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .sub-id-cell::before {
    content: "\21B3";
    position: absolute;
    left: 16px;
    color: var(--border);
  }
  .id-wrap { display: inline-flex; align-items: center; gap: 6px; }
  .copy-btn {
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-size: 0.8rem;
    line-height: 1;
    opacity: 0;
    transition: opacity 0.1s ease, background-color 0.1s ease, color 0.1s ease;
  }
  tr.ui-row:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
  .copy-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .copy-btn.is-copied { opacity: 1; color: #0a7d3d; }
  .type-badge {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .props-cell { display: flex; flex-wrap: wrap; gap: 4px; }
  .prop-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.74rem;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .component-cell code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.82rem;
    background: var(--surface-alt);
    padding: 1px 5px;
    border-radius: 4px;
  }
  .appears-cell { color: var(--ink); }
  .notes-cell { color: var(--ink-muted); }
  .notes-cell a, .appears-cell a {
    color: var(--accent);
    text-decoration: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 600;
  }
  .notes-cell a:hover, .appears-cell a:hover { text-decoration: underline; }
  .empty-state, .no-results {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-size: 0.9rem;
  }
  .count-badge {
    font-size: 0.78rem;
    color: var(--ink-muted);
    font-weight: 400;
  }
</style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to registry</a>

<header>
  <h1>UI Detail Registry</h1>
  <p class="sync-note">
    Mirrors <code>UI-DETAIL.md</code> — same facts, two views. Update both files in the same commit.
    Last synced: <code id="synced-at">(set this when you sync)</code>.
    See <code>anti-ai-slop-design.md</code> §12.3.
  </p>
  <div class="view-toggle" role="tablist" aria-label="Registry view">
    <button type="button" role="tab" id="tab-table" aria-selected="true" aria-controls="app" class="view-btn is-active">Table</button>
    <button type="button" role="tab" id="tab-map" aria-selected="false" aria-controls="map" class="view-btn">Map</button>
  </div>
  <nav class="quick-nav" id="quick-nav" aria-label="Jump to feature group"></nav>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search by ID, name, component, or condition&hellip;" aria-label="Search UI registry">
    <span class="search-shortcut-hint">/</span>
  </div>
  <p class="results-status" id="results-status" role="status" aria-live="polite"></p>
</header>

<main id="main-content" tabindex="-1">
  <div id="app" role="tabpanel" aria-labelledby="tab-table"></div>
  <div id="map" role="tabpanel" aria-labelledby="tab-map" hidden></div>
</main>

<script>
  // ---------------------------------------------------------------------
  // SINGLE SOURCE OF DATA FOR THIS FILE. Mirror UI-DETAIL.md's tables
  // exactly — same letters, same IDs, same "appears when" text. Update
  // this array in the same commit as any change to UI-DETAIL.md; treat
  // the two files as one fact set with two views, never one derived
  // from the other by a build step.
  //
  // Fields:
  //   letter, folder   — matches the "Letter map" table in the .md
  //   id, name, component, appearsWhen, notes — matches a row in the
  //     .md's per-feature table, in the same order
  //   deprecated: true — for a row marked [deprecated] in the .md
  //   relatedIds: ["a1"] — other IDs mentioned in notes/appearsWhen,
  //     so they render as clickable jump links instead of plain text
  // ---------------------------------------------------------------------
  const DATA = {
    syncedAt: "YYYY-MM-DD — set this whenever the arrays below change",
    groups: [
      // Example — replace with your project's real entries, or delete
      // this group entirely once real ones exist.
      {
        letter: "a",
        folder: "features/auth/",
        rows: [
          {
            id: "a1",
            name: "Login form",
            component: "LoginForm.tsx",
            appearsWhen: "Default view at /login for any unauthenticated visitor.",
            notes: "",
            relatedIds: [],
            children: [
              {
                id: "a1.a",
                element: "\"Sign in\" button",
                type: "button",
                action: "Submits the form; on success redirects to dashboard.",
                props: ["isSubmitting", ".btn-primary"],
                notes: "Disabled while submitting.",
                relatedIds: []
              },
              {
                id: "a1.b",
                element: "\"Forgot password?\" link",
                type: "link",
                action: "Opens a2.",
                props: ["--color-link"],
                notes: "",
                relatedIds: ["a2"]
              }
            ]
          },
          {
            id: "a2",
            name: "Password reset modal",
            component: "ResetModal.tsx",
            appearsWhen: "User clicks \"Forgot password?\" on a1.",
            notes: "Child of a1; cancel returns to a1.",
            relatedIds: ["a1"]
          }
        ]
      },
      {
        letter: "b",
        folder: "features/billing/",
        rows: [
          {
            id: "b5",
            name: "Downgrade confirmation",
            description: "A confirmation modal that warns the user before downgrading their plan, blocking the action if their current usage wouldn't fit on the new plan.",
            component: "DowngradeConfirm.tsx",
            appearsWhen: "User selects a lower plan on the billing page AND subscription.status === 'active'.",
            notes: "Blocks downgrade if usage.seats > newPlan.seatLimit; shows b6 instead in that case.",
            relatedIds: [],
            children: [
              {
                id: "b5.a",
                element: "\"Cancel\" button",
                type: "button",
                action: "Closes the modal, returns to the billing page. No request sent.",
                props: ["variant=\"secondary\"", ".btn-secondary"],
                notes: "",
                relatedIds: []
              },
              {
                id: "b5.b",
                element: "\"Confirm downgrade\" button",
                type: "button",
                action: "Calls PATCH /subscription with the new plan. On success, closes and refreshes the billing page.",
                props: ["isSubmitting", "variant=\"danger\"", "--color-danger"],
                notes: "Disabled while isSubmitting; see b5.c for the state that gates it.",
                relatedIds: ["b5.c"]
              },
              {
                id: "b5.c",
                element: "Seat-count warning banner",
                type: "banner",
                action: "\u2014",
                props: ["--color-warning-bg", "--color-warning-text"],
                notes: "Only rendered when usage.seats > newPlan.seatLimit; its presence is what disables b5.b.",
                relatedIds: ["b5.b"]
              }
            ]
          }
        ]
      }
    ]
  };

  // Deliberate, semantic per-type colors — see the CSS custom properties
  // above for the reasoning. Add an entry here if you introduce a new
  // element type; anything not listed falls back to a neutral gray
  // rather than picking a random hue.
  const TYPE_COLORS = {
    button: "button",
    input: "input",
    toggle: "toggle",
    link: "link",
    banner: "banner"
  };

  function typeBadgeHtml(type) {
    const key = TYPE_COLORS[type] || "default";
    return (
      '<span class="type-badge" style="color: var(--type-' + key +
      '); background: var(--type-' + key + '-bg);">' + escapeHtml(type) + "</span>"
    );
  }

  function propsHtml(props) {
    if (!props || props.length === 0) return "";
    return (
      '<div class="props-cell">' +
      props.map(function (p) { return '<span class="prop-chip">' + escapeHtml(p) + "</span>"; }).join("") +
      "</div>"
    );
  }

  const COPY_ICON_SVG =
    '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/>' +
    '<path d="M3.5 10.5H2.75A1.25 1.25 0 0 1 1.5 9.25v-6.5A1.25 1.25 0 0 1 2.75 1.5h6.5A1.25 1.25 0 0 1 10.5 2.75V3.5" stroke="currentColor" stroke-width="1.3"/>' +
    "</svg>";
  const CHECK_ICON_SVG =
    '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    "</svg>";

  function idWithCopyHtml(id) {
    return (
      '<span class="id-wrap">' +
      '<span id="' + escapeHtml(id) + '">' + escapeHtml(id) + "</span>" +
      '<button type="button" class="copy-btn" data-copy-id="' + escapeHtml(id) +
      '" title="Copy ID" aria-label="Copy ID ' + escapeHtml(id) + '">' + COPY_ICON_SVG + "</button>" +
      "</span>"
    );
  }

  function escapeRegex(s) {
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function linkify(text, relatedIds) {
    if (!relatedIds || relatedIds.length === 0) return escapeHtml(text);
    let out = escapeHtml(text);
    relatedIds.forEach(function (rid) {
      const re = new RegExp("\\b" + escapeRegex(rid) + "\\b", "g");
      out = out.replace(re, '<a href="#' + rid + '">' + rid + "</a>");
    });
    return out;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function childRowHtml(child, parentId) {
    return (
      '<tr class="ui-row sub-row" data-parent="' + escapeHtml(parentId) + '" data-search="' +
      escapeHtml((child.id + " " + child.element + " " + child.type + " " + child.action + " " + (child.notes || "") + " " + (child.props || []).join(" ")).toLowerCase()) +
      '">' +
      '<td class="id-cell">' + idWithCopyHtml(child.id, "sub-id-cell") + "</td>" +
      "<td>" + escapeHtml(child.element) + "</td>" +
      "<td>" + typeBadgeHtml(child.type) + "</td>" +
      '<td class="appears-cell">' + linkify(child.action, child.relatedIds) + "</td>" +
      "<td>" + propsHtml(child.props) + "</td>" +
      '<td class="notes-cell">' + linkify(child.notes || "", child.relatedIds) + "</td>" +
      "</tr>"
    );
  }

  function render() {
    const app = document.getElementById("app");
    document.getElementById("synced-at").textContent = DATA.syncedAt;
    const quickNav = document.getElementById("quick-nav");

    if (!DATA.groups.length) {
      app.innerHTML = '<p class="empty-state">No entries yet. Add rows to the DATA object in this file (and to UI-DETAIL.md) as panels are built.</p>';
      quickNav.innerHTML = "";
      return;
    }

    quickNav.innerHTML = DATA.groups.map(function (group) {
      return (
        '<a href="#group-' + escapeHtml(group.letter) + '" data-group="' + escapeHtml(group.letter) + '">' +
        escapeHtml(group.letter) + " &middot; " + escapeHtml(group.folder.replace(/\/$/, "").split("/").pop()) +
        "</a>"
      );
    }).join("");

    app.innerHTML = DATA.groups.map(function (group) {
      const rows = group.rows.map(function (row) {
        const cls = ["ui-row"];
        if (row.deprecated) cls.push("is-deprecated");
        const descHtml = row.description
          ? '<span class="panel-description">' + escapeHtml(row.description) + "</span>"
          : "";
        const parentRow = (
          '<tr class="' + cls.join(" ") + '" data-search="' +
          escapeHtml((row.id + " " + row.name + " " + row.component + " " + row.appearsWhen + " " + row.notes + " " + (row.description || "")).toLowerCase()) +
          '">' +
          '<td class="id-cell">' + idWithCopyHtml(row.id) + "</td>" +
          "<td>" + escapeHtml(row.name) + descHtml + "</td>" +
          '<td class="component-cell"><code>' + escapeHtml(row.component) + "</code></td>" +
          '<td class="appears-cell">' + linkify(row.appearsWhen, row.relatedIds) + "</td>" +
          "<td></td>" +
          '<td class="notes-cell">' + linkify(row.notes, row.relatedIds) + "</td>" +
          "</tr>"
        );
        const childRows = (row.children || []).map(function (child) {
          return childRowHtml(child, row.id);
        }).join("");
        return parentRow + childRows;
      }).join("");

      return (
        '<section class="feature-group" id="group-' + escapeHtml(group.letter) + '" aria-labelledby="group-' + escapeHtml(group.letter) + '-heading">' +
        "<h2 id=\"group-" + escapeHtml(group.letter) + "-heading\"><span class=\"letter\">" + escapeHtml(group.letter) + '</span> ' + escapeHtml(group.folder) +
        ' <span class="count-badge">(' + group.rows.length + ")</span></h2>" +
        "<table>" +
        '<thead><tr><th scope="col">ID</th><th scope="col">Name / Element</th><th scope="col">Component / Type</th><th scope="col">Appears when / Action</th><th scope="col">Key props / style</th><th scope="col">Notes</th></tr></thead>' +
        "<tbody>" + rows + '<tr class="no-results-row is-hidden"><td colspan="6" class="no-results">No matches for this search.</td></tr>' +
        "</tbody>" +
        "</table>" +
        "</section>"
      );
    }).join("");

    // Jump to a specific ID via ?id=b5 or a #b5 hash, and highlight it.
    const hash = window.location.hash.replace("#", "");
    if (hash) {
      const target = document.getElementById(hash);
      if (target) {
        const row = target.closest("tr");
        if (row) row.classList.add("is-target");
        if (typeof target.scrollIntoView === "function") {
          try {
            target.scrollIntoView({ block: "center" });
          } catch (e) {
            /* scrollIntoView is best-effort — the highlight above is what actually matters */
          }
        }
      }
    }
  }

  // ---- Map view ----
  // Pure and directly testable: walks DATA and returns every
  // relationship as a deduplicated { from, to } pair, regardless of
  // which side of the pair declared relatedIds first (a1 -> a2 and
  // a2 -> a1 collapse to one connector, not two).
  function collectConnections(data) {
    const seen = new Set();
    const pairs = [];
    function addPair(a, b) {
      const key = [a, b].sort().join("::");
      if (seen.has(key) || a === b) return;
      seen.add(key);
      pairs.push({ from: a, to: b });
    }
    (data.groups || []).forEach(function (group) {
      (group.rows || []).forEach(function (row) {
        (row.relatedIds || []).forEach(function (rid) { addPair(row.id, rid); });
        (row.children || []).forEach(function (child) {
          (child.relatedIds || []).forEach(function (rid) { addPair(child.id, rid); });
        });
      });
    });
    return pairs;
  }

  function renderMap() {
    const mapEl = document.getElementById("map");

    if (!DATA.groups.length) {
      mapEl.innerHTML = '<p class="map-empty">No entries yet — the map fills in as panels are added to DATA.</p>';
      return;
    }

    const legend = (
      '<div class="map-legend">' +
      Object.keys(TYPE_COLORS).concat(["default"]).map(function (t) {
        return '<span><span class="swatch" style="background: var(--type-' + t + ');"></span>' + t + "</span>";
      }).join("") +
      "</div>"
    );

    const groups = DATA.groups.map(function (group) {
      const nodes = group.rows.map(function (row) {
        const subnodes = (row.children || []).map(function (child) {
          const key = TYPE_COLORS[child.type] || "default";
          return (
            '<span class="map-subnode" data-map-id="' + escapeHtml(child.id) +
            '" style="color: var(--type-' + key + '); background: var(--type-' + key + '-bg);">' +
            escapeHtml(child.id) + "</span>"
          );
        }).join("");
        return (
          '<div class="map-node' + (row.deprecated ? " is-deprecated" : "") + '" data-map-id="' + escapeHtml(row.id) + '">' +
          '<div class="map-node-id">' + escapeHtml(row.id) + "</div>" +
          '<div class="map-node-name">' + escapeHtml(row.name) + "</div>" +
          '<div class="map-node-condition">' + escapeHtml(row.appearsWhen || "") + "</div>" +
          (subnodes ? '<div class="map-subnodes">' + subnodes + "</div>" : "") +
          "</div>"
        );
      }).join("");

      return (
        '<div class="map-group" id="map-group-' + escapeHtml(group.letter) + '">' +
        '<h3 class="map-group-title"><span class="letter">' + escapeHtml(group.letter) + "</span> " + escapeHtml(group.folder) + "</h3>" +
        '<div class="map-lane">' + nodes + "</div>" +
        "</div>"
      );
    }).join("");

    mapEl.innerHTML = legend + groups + '<svg id="map-connectors" aria-hidden="true"></svg>';
    drawConnectors();
  }

  function drawConnectors() {
    const svg = document.getElementById("map-connectors");
    const mapEl = document.getElementById("map");
    if (!svg || !mapEl) return;
    svg.innerHTML =
      '<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">' +
      '<path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"></path></marker></defs>';

    const mapRect = mapEl.getBoundingClientRect();
    // If the map isn't actually laid out yet (hidden, or a test
    // environment with no real layout engine), bounding rects are all
    // zero — skip drawing rather than plot garbage lines at (0,0).
    if (mapRect.width === 0 && mapRect.height === 0) return;

    collectConnections(DATA).forEach(function (pair) {
      const fromEl = mapEl.querySelector('[data-map-id="' + pair.from + '"]');
      const toEl = mapEl.querySelector('[data-map-id="' + pair.to + '"]');
      if (!fromEl || !toEl) return;
      const r1 = fromEl.getBoundingClientRect();
      const r2 = toEl.getBoundingClientRect();
      if ((r1.width === 0 && r1.height === 0) || (r2.width === 0 && r2.height === 0)) return;

      const x1 = r1.left + r1.width / 2 - mapRect.left;
      const y1 = r1.top + r1.height / 2 - mapRect.top;
      const x2 = r2.left + r2.width / 2 - mapRect.left;
      const y2 = r2.top + r2.height / 2 - mapRect.top;
      const midY = (y1 + y2) / 2;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M" + x1 + "," + y1 + " C " + x1 + "," + midY + " " + x2 + "," + midY + " " + x2 + "," + y2);
      path.setAttribute("marker-end", "url(#arrow)");
      path.setAttribute("data-from", pair.from);
      path.setAttribute("data-to", pair.to);
      svg.appendChild(path);
    });
  }

  function announceResults(q) {
    const status = document.getElementById("results-status");
    if (!q) { status.textContent = ""; return; }
    const visibleCount = Array.from(document.querySelectorAll("tr.ui-row"))
      .filter(function (r) { return !r.classList.contains("is-hidden"); }).length;
    status.textContent = visibleCount === 0
      ? "No matches for \"" + q + "\"."
      : visibleCount + (visibleCount === 1 ? " match" : " matches") + " for \"" + q + "\".";
  }

  document.getElementById("search").addEventListener("input", function (e) {
    const q = e.target.value.trim().toLowerCase();
    const allRows = document.querySelectorAll("tr.ui-row");

    if (q.length === 0) {
      allRows.forEach(function (row) { row.classList.remove("is-hidden"); });
      document.querySelectorAll(".no-results-row").forEach(function (r) { r.classList.add("is-hidden"); });
      announceResults("");
      return;
    }

    const ownMatch = new Map();
    allRows.forEach(function (row) {
      const hay = row.getAttribute("data-search") || "";
      ownMatch.set(row, hay.includes(q));
    });

    allRows.forEach(function (row) {
      if (row.classList.contains("sub-row")) return; // parents handled below
      const parentMatches = ownMatch.get(row);
      const rowId = row.querySelector(".id-cell [id]").id;
      const children = document.querySelectorAll('tr.sub-row[data-parent="' + rowId + '"]');
      let anyChildMatches = false;
      children.forEach(function (c) { if (ownMatch.get(c)) anyChildMatches = true; });

      const parentVisible = parentMatches || anyChildMatches;
      row.classList.toggle("is-hidden", !parentVisible);

      children.forEach(function (c) {
        // If the parent text itself matched, show all its children for
        // context. Otherwise show only the children that individually
        // matched the query.
        const childVisible = parentMatches || ownMatch.get(c);
        c.classList.toggle("is-hidden", !childVisible);
      });
    });

    // Show a "no matches" row per table whose every real row is hidden.
    document.querySelectorAll(".feature-group table").forEach(function (table) {
      const noResultsRow = table.querySelector(".no-results-row");
      if (!noResultsRow) return;
      const anyVisible = Array.from(table.querySelectorAll("tr.ui-row"))
        .some(function (r) { return !r.classList.contains("is-hidden"); });
      noResultsRow.classList.toggle("is-hidden", anyVisible);
    });

    announceResults(e.target.value.trim());
  });

  // Copy an ID to the clipboard on click, with a fallback for contexts
  // (like a plain file:// page in some browsers) where the modern
  // Clipboard API isn't available. Success is shown by briefly swapping
  // the icon, not an alert — the point is speed, not interruption.
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy") ? resolve() : reject(new Error("execCommand copy failed"));
      } catch (err) {
        reject(err);
      } finally {
        document.body.removeChild(ta);
      }
    });
  }

  document.getElementById("app").addEventListener("click", function (e) {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;
    const id = btn.getAttribute("data-copy-id");
    copyText(id).then(function () {
      const original = btn.innerHTML;
      btn.innerHTML = CHECK_ICON_SVG;
      btn.classList.add("is-copied");
      setTimeout(function () {
        btn.innerHTML = original;
        btn.classList.remove("is-copied");
      }, 1200);
    }).catch(function () {
      /* Clipboard access denied or unavailable — the ID is still
         visible and selectable by hand, so this fails quietly rather
         than interrupting with an error dialog. */
    });
  });

  // Press "/" anywhere outside a text field to jump straight to search —
  // matches the convention from GitHub and similar tools.
  document.addEventListener("keydown", function (e) {
    if (e.key !== "/") return;
    const active = document.activeElement;
    const isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable);
    if (isTyping) return;
    e.preventDefault();
    document.getElementById("search").focus();
  });

  // Table / Map view toggle.
  let currentView = "table";
  function setView(view) {
    currentView = view;
    const tableBtn = document.getElementById("tab-table");
    const mapBtn = document.getElementById("tab-map");
    const app = document.getElementById("app");
    const map = document.getElementById("map");

    const showTable = view === "table";
    app.hidden = !showTable;
    map.hidden = showTable;
    tableBtn.classList.toggle("is-active", showTable);
    mapBtn.classList.toggle("is-active", !showTable);
    tableBtn.setAttribute("aria-selected", String(showTable));
    mapBtn.setAttribute("aria-selected", String(!showTable));

    if (!showTable) {
      // Positions only make sense once the map is actually visible —
      // (re)draw connectors now that layout can be measured. Fall back
      // to setTimeout if requestAnimationFrame isn't available in this
      // environment, rather than throwing and silently skipping the draw.
      if (typeof requestAnimationFrame === "function") {
        requestAnimationFrame(drawConnectors);
      } else {
        setTimeout(drawConnectors, 0);
      }
    }
  }
  document.getElementById("tab-table").addEventListener("click", function () { setView("table"); });
  document.getElementById("tab-map").addEventListener("click", function () { setView("map"); });

  // Quick-nav works from either view: switch view first if needed, then
  // scroll to that group's section in whichever view is now showing.
  document.getElementById("quick-nav").addEventListener("click", function (e) {
    const link = e.target.closest("a[data-group]");
    if (!link) return;
    e.preventDefault();
    const letter = link.getAttribute("data-group");
    const targetId = (currentView === "table" ? "group-" : "map-group-") + letter;
    const target = document.getElementById(targetId);
    if (target && typeof target.scrollIntoView === "function") {
      try { target.scrollIntoView({ block: "start", behavior: "smooth" }); } catch (e2) { /* best-effort */ }
    }
  });

  // Hovering (or focusing) a node highlights its connectors, so a busy
  // map stays readable — the other lines don't visually compete for
  // attention until you ask.
  document.getElementById("map").addEventListener("mouseover", function (e) {
    const node = e.target.closest("[data-map-id]");
    if (!node) return;
    const id = node.getAttribute("data-map-id");
    document.querySelectorAll("#map-connectors path").forEach(function (p) {
      if (p.getAttribute("data-from") === id || p.getAttribute("data-to") === id) {
        p.classList.add("is-highlighted");
      }
    });
  });
  document.getElementById("map").addEventListener("mouseout", function (e) {
    const node = e.target.closest("[data-map-id]");
    if (!node) return;
    document.querySelectorAll("#map-connectors path.is-highlighted").forEach(function (p) {
      p.classList.remove("is-highlighted");
    });
  });

  // Redraw connectors on resize, but only while the map is the visible
  // view — no point recomputing positions no one can see.
  window.addEventListener("resize", function () {
    if (currentView === "map") drawConnectors();
  });

  render();
  renderMap();
</script>

</body>
</html>
