<!DOCTYPE html>
<!--
  PROMPT-LOG.html — extension guide, read before changing anything.

  - Single data source: the LOG array below. Mirror PROMPT-LOG.md
    exactly — same dates, same prompt text, same results — and update
    both in the same commit, the same sync contract UI-DETAIL.md and
    UI-DETAIL.html already use elsewhere in this project's tooling.
  - Delete the example entries in LOG before using this for a real
    project — they exist only to show the page working on first open.
  - New fields are additive and optional by default; don't assume every
    entry has every field.
  - Before shipping a change to this file, run it through a real DOM
    (jsdom is enough) and check for thrown errors, not just "it looks
    right" — see anti-ai-slop-code.md's 10-Layer Audit (§18).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Log</title>
<style>
  :root {
    --ink: #1a1d23;
    --ink-muted: #5a6270;
    --border: #e2e5eb;
    --surface: #ffffff;
    --surface-alt: #f6f7f9;
    --accent: #3454d1;
    --accent-soft: #edf0fc;
    --radius: 6px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--surface-alt);
    line-height: 1.5;
  }
  .skip-link {
    position: absolute;
    left: -999px;
    top: 0;
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    z-index: 100;
    border-radius: 0 0 6px 0;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .skip-link:focus { left: 0; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  h1 { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sync-note { font-size: 0.8rem; color: var(--ink-muted); margin: 0 0 14px; }
  .sync-note code { background: var(--surface-alt); padding: 1px 5px; border-radius: 4px; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search-wrap { position: relative; max-width: 420px; flex: 1 1 300px; }
  #search {
    width: 100%;
    padding: 9px 34px 9px 12px;
    font-size: 0.9rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-shortcut-hint {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem;
    color: var(--ink-muted);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    pointer-events: none;
  }
  #search:focus ~ .search-shortcut-hint { display: none; }
  #sort-toggle {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.82rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
  }
  #sort-toggle:hover { border-color: var(--accent); color: var(--accent); }
  #sort-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .results-status { font-size: 0.78rem; color: var(--ink-muted); margin: 8px 0 0; min-height: 1.1em; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 28px 60px; }
  .date-group { margin-bottom: 22px; }
  .date-heading {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    margin: 0 0 10px;
  }
  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 10px;
  }
  .entry.is-hidden { display: none; }
  .entry-prompt {
    font-size: 0.9rem;
    color: var(--ink);
    margin: 0 0 8px;
    font-style: italic;
  }
  .entry-prompt::before { content: open-quote; }
  .entry-prompt::after { content: close-quote; }
  .entry-result {
    font-size: 0.82rem;
    color: var(--ink-muted);
    margin: 0;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .entry-result strong { color: var(--ink); font-weight: 600; }
  .entry-footer {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .copy-btn {
    border: none;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 0.72rem;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background-color 0.1s ease, color 0.1s ease;
  }
  .copy-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-btn.is-copied { color: #0a7d3d; }
  .empty-state, .no-results {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<a class="skip-link" href="#main-content">Skip to log</a>

<header>
  <h1>Prompt Log</h1>
  <p class="sync-note">
    Mirrors <code>PROMPT-LOG.md</code> — same facts, two views. Update both files in the same commit.
  </p>
  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search prompts and results&hellip;" aria-label="Search prompt log">
      <span class="search-shortcut-hint">/</span>
    </div>
    <button type="button" id="sort-toggle" aria-label="Toggle sort order">Newest first &#8593;</button>
  </div>
  <p class="results-status" id="results-status" role="status" aria-live="polite"></p>
</header>

<main id="main-content" tabindex="-1">
  <div id="app"></div>
</main>

<script>
  // ---------------------------------------------------------------------
  // SINGLE SOURCE OF DATA. Mirror PROMPT-LOG.md exactly. Update this
  // array in the same commit as any change there.
  //
  // DELETE THE EXAMPLE ENTRY BELOW before using this file for a real
  // project — it exists only so opening this file for the first time
  // shows the log actually working, not to ship.
  //
  // Fields: date ("YYYY-MM-DD"), prompt (string, close to verbatim),
  // result (string, one line — what was actually done)
  // ---------------------------------------------------------------------
  const LOG = [
    {
      date: "2026-07-27",
      prompt: "add a UI-DETAIL.md registry with stable IDs (a3, b5, n6) so we can give very specific instructions",
      result: "Added \u00a712.3 to the design guide, templates/UI-DETAIL.md, templates/UI-DETAIL.html."
    }
  ];

  let sortDescending = true; // newest first, by default

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  const COPY_ICON_SVG =
    '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/>' +
    '<path d="M3.5 10.5H2.75A1.25 1.25 0 0 1 1.5 9.25v-6.5A1.25 1.25 0 0 1 2.75 1.5h6.5A1.25 1.25 0 0 1 10.5 2.75V3.5" stroke="currentColor" stroke-width="1.3"/>' +
    "</svg>";
  const CHECK_ICON_SVG =
    '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    "</svg>";

  // Pure and directly testable: groups LOG entries by date and returns
  // them in the requested order, without touching the DOM.
  function groupByDate(log, descending) {
    const byDate = new Map();
    log.forEach(function (entry) {
      if (!byDate.has(entry.date)) byDate.set(entry.date, []);
      byDate.get(entry.date).push(entry);
    });
    const dates = Array.from(byDate.keys()).sort(function (a, b) {
      return descending ? b.localeCompare(a) : a.localeCompare(b);
    });
    return dates.map(function (date) { return { date: date, entries: byDate.get(date) }; });
  }

  function render() {
    const app = document.getElementById("app");
    if (LOG.length === 0) {
      app.innerHTML = '<p class="empty-state">No prompts logged yet — add entries to the LOG array in this file (and to PROMPT-LOG.md) as they happen.</p>';
      return;
    }
    const groups = groupByDate(LOG, sortDescending);
    app.innerHTML = groups.map(function (group) {
      const entries = group.entries.map(function (entry, i) {
        const searchable = (entry.prompt + " " + (entry.result || "")).toLowerCase();
        const resultHtml = entry.result
          ? '<p class="entry-result"><strong>Result:</strong> ' + escapeHtml(entry.result) + "</p>"
          : "";
        return (
          '<div class="entry" data-search="' + escapeHtml(searchable) + '">' +
          '<p class="entry-prompt">' + escapeHtml(entry.prompt) + "</p>" +
          resultHtml +
          '<div class="entry-footer"><button type="button" class="copy-btn" data-copy-text="' +
          escapeHtml(entry.prompt) + '" aria-label="Copy this prompt">' + COPY_ICON_SVG + " Copy</button></div>" +
          "</div>"
        );
      }).join("");
      return (
        '<div class="date-group">' +
        '<h2 class="date-heading">' + escapeHtml(group.date) + "</h2>" +
        entries +
        "</div>"
      );
    }).join("") + '<p class="no-results is-hidden">No matches for this search.</p>';
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy") ? resolve() : reject(new Error("execCommand copy failed"));
      } catch (err) {
        reject(err);
      } finally {
        document.body.removeChild(ta);
      }
    });
  }

  document.getElementById("app").addEventListener("click", function (e) {
    const btn = e.target.closest(".copy-btn");
    if (!btn) return;
    const text = btn.getAttribute("data-copy-text");
    copyText(text).then(function () {
      const original = btn.innerHTML;
      btn.innerHTML = CHECK_ICON_SVG + " Copied";
      btn.classList.add("is-copied");
      setTimeout(function () {
        btn.innerHTML = original;
        btn.classList.remove("is-copied");
      }, 1200);
    }).catch(function () {
      /* fails quietly — the text is still visible and selectable by hand */
    });
  });

  document.getElementById("sort-toggle").addEventListener("click", function () {
    sortDescending = !sortDescending;
    this.textContent = sortDescending ? "Newest first \u2191" : "Oldest first \u2193";
    render();
    applySearch(document.getElementById("search").value);
  });

  function applySearch(rawQuery) {
    const q = rawQuery.trim().toLowerCase();
    const entries = document.querySelectorAll(".entry");
    const status = document.getElementById("results-status");
    const noResults = document.querySelector(".no-results");

    if (q.length === 0) {
      entries.forEach(function (e) { e.classList.remove("is-hidden"); });
      document.querySelectorAll(".date-group").forEach(function (g) { g.classList.remove("is-hidden"); });
      if (noResults) noResults.classList.add("is-hidden");
      status.textContent = "";
      return;
    }

    let visibleCount = 0;
    document.querySelectorAll(".date-group").forEach(function (group) {
      let groupHasVisible = false;
      group.querySelectorAll(".entry").forEach(function (entry) {
        const hay = entry.getAttribute("data-search") || "";
        const matches = hay.includes(q);
        entry.classList.toggle("is-hidden", !matches);
        if (matches) { groupHasVisible = true; visibleCount++; }
      });
      group.classList.toggle("is-hidden", !groupHasVisible);
    });

    if (noResults) noResults.classList.toggle("is-hidden", visibleCount > 0);
    status.textContent = visibleCount === 0
      ? "No matches for \"" + rawQuery.trim() + "\"."
      : visibleCount + (visibleCount === 1 ? " match" : " matches") + " for \"" + rawQuery.trim() + "\".";
  }

  document.getElementById("search").addEventListener("input", function (e) {
    applySearch(e.target.value);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "/") return;
    const active = document.activeElement;
    const isTyping = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.isContentEditable);
    if (isTyping) return;
    e.preventDefault();
    document.getElementById("search").focus();
  });

  render();
</script>

</body>
</html>
